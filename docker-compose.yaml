services:
  airflow:
    image: ${AIRFLOW_IMAGE:-apache/airflow:3.3.2}
    command: standalone
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      AIRFLOW__API__BASE_URL: "http://localhost:8080"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW_CONN_ALERT_SLACK: '{"conn_type": "generic", "password": "${SLACK_WEBHOOK_URL:-}"}'
      _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-common-ai pydantic-ai-slim[openai,huggingface] ${EXTRA_PIP:-}"
    volumes:
      - ./dags:/opt/airflow/dags

  approver:
    image: python:3.12-slim
    profiles: ["slack-approval"]
    command: python -m approver.server
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      AIRFLOW_API_URL: "http://airflow:8080"
    ports:
      - "8081:8081"
    volumes:
      - ./approver:/app/approver:ro
      - ./dags/healing:/app/dags/healing:ro
    depends_on:
      - airflow
